version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    # Both projects share this config; $READTHEDOCS_PROJECT selects the build.
    - |
      if [ "$READTHEDOCS_PROJECT" = "poolparty" ]; then
        python -m pip install ./statetracker ./poolparty[docs]
        python -m sphinx -b html poolparty/docs $READTHEDOCS_OUTPUT/html
      elif [ "$READTHEDOCS_PROJECT" = "statetracker" ]; then
        python -m pip install ./statetracker[docs]
        python -m sphinx -b html statetracker/docs $READTHEDOCS_OUTPUT/html
      else
        echo "Unknown project: $READTHEDOCS_PROJECT" && exit 1
      fi
